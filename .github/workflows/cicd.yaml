name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build the Go application
        run: go build -o go-web-app .

      - name: Run tests
        run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    env:
       FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 : "true"   

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run
          
  push:
    runs-on: ubuntu-latest
    needs:
      - build
      - code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.run_number }}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm chart with new Docker image tag
        run: |
          sed -i 's#^\s*tag:\s*.*#  tag: "${{ github.run_number }}"#' helm/go-web-app-chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/go-web-app-chart/values.yaml
          if git diff --cached --quiet; then
            echo "Helm chart already has the current tag; skipping commit."
            exit 0
          fi
          git commit -m "Update Helm chart with new Docker image tag ${{ github.run_number }}"
          git push origin HEAD:main