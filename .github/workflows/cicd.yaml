name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build the Go application
        run: go build -o go-web-app .

      - name: Run tests
        run: go test ./...
     
  code-quality:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.50.0
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          args: run ./...
    
  push:
    runs-on: ubuntu-latest

    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 


      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{github.run_number}}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push

    steps:
      - name: Checkout code
        uses: actions/checkout@v3 
        with:
          token: ${{ secrets.TOKEN }}
        

      - name: Update Helm chart with new Docker image tag
        run: |
          sed -i "s/tag:.*/tag: \"${{ github.run_number }}\"/" helm/go-web-app-chart/values.yaml
          git config --global user.name "Techpro05"
          git config --global user.email "naveencolt05@gmail.com"
          git add helm/go-web-app-chart/values.yaml
          git commit -m "Update Helm chart with new Docker image tag ${{ github.run_number }}"
          git push origin main        